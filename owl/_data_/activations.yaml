---
# Activation Functions Configuration
# Standard neural network activation functions

activations:
  sigmoid:
    name: Sigmoid
    formula: "1 / (1 + exp(-x))"
    range: [0, 1]
    derivative: "x * (1 - x)"

  tanh:
    name: Hyperbolic Tangent
    formula: "(exp(x) - exp(-x)) / (exp(x) + exp(-x))"
    range: [-1, 1]
    derivative: "1 - tanh(x)^2"

  relu:
    name: Rectified Linear Unit
    formula: "max(0, x)"
    range: [0, +inf]
    derivative: "1 if x > 0 else 0"

  leaky_relu:
    name: Leaky ReLU
    formula: "x if x > 0 else 0.01 * x"
    range: [-inf, +inf]
    derivative: "1 if x > 0 else 0.01"

  softmax:
    name: Softmax
    formula: "exp(x_i) / sum(exp(x))"
    range: [0, 1]
    derivative: "x_i * (1 - x_i)"

  elu:
    name: Exponential Linear Unit
    formula: "x if x > 0 else alpha * (exp(x) - 1)"
    range: [-alpha, +inf]
    derivative: "1 if x > 0 else alpha * exp(x)"
