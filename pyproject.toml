[project]
name = "owl"
version = "0.1.0"
description = "Machine learning and prediction framework"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
]
tsfresh = [
    "tsfresh>=0.20.0",
]

[tool.sasquatch]
license = "MIT"

[tool.sasquatch.license_metadata]
"owl" = "MIT"
"kahndor" = "MIT"
"ogma" = "MIT"
"subtrix" = "MIT"
"micromole" = "MIT"

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint]
max-line-length = 88

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
