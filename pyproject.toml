[project]
name = "owl"
version = "0.1.0"
description = "Machine learning and prediction framework"
requires-python = ">=3.11"
dependencies = [

]

[tool.sasquatch]
license = "MIT"

[tool.sasquatch.license_metadata]
"owl" = "MIT"
"kahndor" = "MIT"
"ogma" = "MIT"
"subtrix" = "MIT"
"micromole" = "MIT"

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint]
max-line-length = 88

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
